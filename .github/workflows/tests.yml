name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10', '11', '12']
        exclude:
          # Laravel 12 needs PHP 8.2+, Laravel 10 is only tested up to PHP 8.3.
          - php: '8.4'
            laravel: '10'
        include:
          - laravel: '10'
            testbench: '^8.0'
            pest: '^2.0'
          - laravel: '11'
            testbench: '^9.0'
            pest: '^3.0'
          - laravel: '12'
            testbench: '^10.0'
            pest: '^3.0'
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Install dependencies
        run: >
          composer update --no-interaction --no-progress --prefer-dist
          --with "laravel/framework:^${{ matrix.laravel }}.0"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "pestphp/pest:${{ matrix.pest }}"
      - name: Run the tests
        run: vendor/bin/pest
